spring.application.name=demo

# --- Banco em memoria (console em http://localhost:8080/h2-console) ---
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Envio de webhooks ---
app.webhook.max-attempts=3
app.webhook.retry-delay=500ms
app.webhook.connect-timeout=3s
app.webhook.read-timeout=5s
app.webhook.signature-header=X-Webhook-Signature
app.webhook.event-id-header=X-Webhook-Event-Id
app.webhook.event-type-header=X-Webhook-Event-Type

logging.level.com.example.demo=DEBUG
